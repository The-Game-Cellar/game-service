spring:
  application:
    name: game-service
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/game-cellar}
  datasource:
    url: ${GAME_DB_URL}
    username: ${GAME_DB_USERNAME}
    password: ${GAME_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    clean-disabled: true
    locations: classpath:db/migration

server:
  port: ${GAME_SERVICE_PORT:8081}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false

logging:
  pattern:
    console: "%clr(%d{HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr([%X{requestId:-........}]){magenta} %clr([%-15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"

sentry:
  # Empty default is deliberate: with no DSN the SDK is a no-op, so local runs and the
  # test suite never ship events. Only production sets it.
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:local}
  release: ${SENTRY_RELEASE:}
  traces-sample-rate: 0
  send-default-pii: false
  # Lifts the MDC key onto the event as a tag, which is what ties an event to its log lines.
  context-tags:
    - requestId

security:
  internal:
    token: ${INTERNAL_SERVICE_TOKEN:}

igdb:
  client-id: ${TWITCH_CLIENT_ID}
  client-secret: ${TWITCH_CLIENT_SECRET}
  connect-timeout: ${IGDB_CONNECT_TIMEOUT:2000}
  read-timeout: ${IGDB_READ_TIMEOUT:10000}
  api:
    base-url: ${IGDB_API_BASE_URL:https://api.igdb.com/v4}
  worker:
    enabled: ${IGDB_WORKER_ENABLED:true}
    discovery-limit: ${IGDB_WORKER_DISCOVERY_LIMIT:500}
    discovery-pages: ${IGDB_WORKER_DISCOVERY_PAGES:50}
    new-releases-pages: ${IGDB_WORKER_NEW_RELEASES_PAGES:10}
    cron: ${IGDB_WORKER_CRON:0 30 3 * * *}
    rate-limit-delay-ms: ${IGDB_WORKER_RATE_LIMIT_DELAY_MS:250}
    # Bulk pages deep in the catalog run close to 10 s at IGDB; the request-path read-timeout would drop them.
    read-timeout: ${IGDB_WORKER_READ_TIMEOUT:30000}
    # Wait before the single retry of a failed page.
    retry-delay-ms: ${IGDB_WORKER_RETRY_DELAY_MS:2000}
  background-art:
    enabled: ${IGDB_BACKGROUND_ART_ENABLED:true}
    # One hour after the catalog worker, so the night's harvested pools are in hand.
    cron: ${IGDB_BACKGROUND_ART_CRON:0 30 4 * * *}
    # Games decided per pass. Raise temporarily for catch-up after a deploy.
    batch-size: ${IGDB_BACKGROUND_ART_BATCH_SIZE:5000}
    # Politeness delay between games; each game downloads at most three candidate images.
    download-delay-ms: ${IGDB_BACKGROUND_ART_DOWNLOAD_DELAY_MS:200}

cellar:
  ratings:
    # Votes needed to pull a game halfway from the IGDB score to our members' average.
    # Raising it makes the blend more conservative; the stored aggregates never change.
    prior-weight: ${CELLAR_RATING_PRIOR_WEIGHT:10}
