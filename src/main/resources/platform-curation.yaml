# Platform curation: which platforms appear in the user-facing Preferences picker,
# how they are grouped, and in what order.
#
# Top-level key = category (manufacturer grouping) used to lay out the picker.
# Each entry sets is_preference_eligible = TRUE on the matching `platforms` row and
# fills in category + display_order. Platforms absent from this file keep the column
# defaults (is_preference_eligible = FALSE, display_order = 999): they still attach to
# games and still show on Add-to-Library / Library filter / Game Detail metadata, they
# are just hidden from the Preferences UI.
#
# `name` must match the canonical platform name exactly, i.e. the IGDB platform name
# after IgdbPlatformMapper.normalize() has collapsed variants ("PlayStation 5 Pro" ->
# "PlayStation 5"). A name with no matching row is reported at startup and ignored.
#
# `order` sorts inside a category, lowest first. Gaps are deliberate so new platforms
# can be slotted in without renumbering the rest.
#
# Applied in two places, so ordering against the IGDB catalog sync never matters:
#   PlatformCuration      - consulted when GameCacheService first creates a platform row
#   PlatformCurationReconciler - reconciles every existing row at application startup
# Workflow: edit this file, restart game-service, done.

